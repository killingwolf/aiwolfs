# 角色声明 —— 每个服务一个角色，角色决定成员能收到哪些命名空间的资源。
# 与 members.yaml 配合实现"服务端集中分配"：成员自己 `teamai roles set` 会被拒绝。
# 注意：skills 里的 ecc / mattpocock 是仓库中已存在的通用技能集合命名空间，
# 所有角色都包含它们；common 是共享命名空间（rules/common、agents/common、skills/common）。
version: 1
roles:
  - id: svc-a
    description: 负责服务 A 的成员
    resources:
      knowledge: [common, svc-a]
      skills: [common, ecc, mattpocock, svc-a]
      agents: [common, svc-a]
      mcp: [svc-a]
      env: [svc-a]
      docs: [svc-a]

  - id: svc-b
    description: 负责服务 B 的成员
    resources:
      knowledge: [common, svc-b]
      skills: [common, ecc, mattpocock, svc-b]
      agents: [common, svc-b]
      mcp: [svc-b]
      env: [svc-b]
      docs: [svc-b]

  - id: svc-c
    description: 负责服务 C 的成员
    resources:
      knowledge: [common, svc-c]
      skills: [common, ecc, mattpocock, svc-c]
      agents: [common, svc-c]
      mcp: [svc-c]
      env: [svc-c]
      docs: [svc-c]
