# 服务 A 专属环境变量（svc-a 命名空间 → 拥有 svc-a 角色的成员：张三与管理者）。
# 分发语义：随角色合并进成员的 ~/.teamai/env.sh，注入其本机所有 shell（user scope 的 env-loader），
# 不是"cd 进服务目录才生效"——目录级切换需要 project scope 安装并 `teamai projects set svc-a`。
# 注意：多服务同名变量会相互覆盖（后加载者胜）；真实密钥请声明为 secret（env/svc-a/secrets.yaml
# + 各机 teamai env set），不要写进本文件（仓库为 PUBLIC）。
variables:
  - key: SVC_A_API_BASE
    value: https://svc-a.internal.example.com
    description: 服务 A API 地址
  - key: SVC_A_ENV
    value: staging
    description: 服务 A 默认环境
