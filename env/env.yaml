variables:
  - key: UV_DEFAULT_INDEX
    value: https://pypi.tuna.tsinghua.edu.cn/simple
    description: uv 默认 PyPI 镜像（清华）
  - key: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
    value: "1"
    description: Claude Code 关闭非必要网络流量（免认证）
  - key: CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS
    value: "1"
    description: Claude Code 实验性 Agent Teams
  - key: CLAUDE_CODE_MAX_CONTEXT_TOKENS
    value: "1000000"
    description: Claude Code 上下文长度上限（1M）
  - key: FNM_NODE_DIST_MIRROR
    value: https://mirrors.aliyun.com/nodejs-release/
    description: fnm Node.js 发行包镜像（阿里云）
  - key: ANTHROPIC_MODEL
    value: qwen3.8-max
    description: Claude Code 主模型（单机切换：teamai env set ANTHROPIC_MODEL <model>）
  - key: ANTHROPIC_DEFAULT_OPUS_MODEL
    value: qwen3.8-max
    description: Opus 档位路由模型
  - key: ANTHROPIC_DEFAULT_SONNET_MODEL
    value: qwen3.8-max
    description: Sonnet 档位路由模型
  - key: ANTHROPIC_DEFAULT_HAIKU_MODEL
    value: qwen3.8-max
    description: Haiku 档位路由模型
